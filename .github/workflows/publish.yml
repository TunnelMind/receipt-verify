name: Publish to npm (Trusted Publishing)

# OIDC-based publish — no long-lived npm token. npm trusts this exact
# repo+workflow via the "Trusted Publisher" config on npmjs.com for
# @tunnelmindai/receipt-verify. TS package; prepublishOnly runs the build.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Use OIDC-capable npm
        run: npm install -g npm@11.21.1

      # Never publish an untested tarball: the tests import from dist/, so build first.
      - name: Install, build, test
        run: |
          npm ci
          npm run build
          npm test

      - name: Publish @tunnelmindai/receipt-verify
        run: npm publish --access public --provenance
