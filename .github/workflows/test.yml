name: test
# Build and run the suite on every push and pull request. Until this job,
# the tests ran only inside publish.yml, so a PR could merge with them red.
# The matrix covers every Node line package.json "engines" (>=20) promises:
# the library needs globalThis.crypto with Ed25519, so a pass on one line
# says nothing about another. Node 18 was dropped when this job found it
# never worked there (no globalThis.crypto; every import threw).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # The tests import from dist/, so build first.
      - run: npm ci
      - run: npm run build
      - run: npm test
